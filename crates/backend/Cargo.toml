[package]
name = "backend"
version.workspace = true
edition.workspace = true

[dependencies]
contracts = { path = "../contracts" }

sea-orm = { version = "0.12", features = ["sqlx-sqlite", "runtime-tokio-native-tls", "macros", "with-json", "sea-orm-internal"] }
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-native-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync"] }
anyhow = "1"
axum = { version = "0.7", features = ["macros", "multipart"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
jsonschema = { version = "0.29", default-features = false }
chrono = { workspace = true }
once_cell = { workspace = true }
uuid = { workspace = true }
# "stream" — потоковое чтение тела ответа (bytes_stream): снапшот БД в несколько
# гигабайт нельзя буферизовать в память целиком ни при выгрузке, ни при загрузке.
reqwest = { version = "0.12", features = ["json", "gzip", "deflate", "stream"] }
async-trait = "0.1"
urlencoding = "2.1"
jsonwebtoken = "9"
argon2 = "0.5"
rand = "0.9"
base64 = "0.22"
sha2 = "0.10"
toml = "0.8"
# default-features=false отключает rustls: иначе reqwest линкует ДВА TLS-стека
# (rustls+ring от async-openai и native-tls от reqwest/default-tls).
# native-tls согласован с sea-orm/sqlx (runtime-tokio-native-tls).
async-openai = { version = "0.32.3", default-features = false, features = ["chat-completion", "model", "native-tls"] }
futures-util = "0.3"
bytes = "1"
hmac = "0.12"
thiserror = "2"
csv = "1"
encoding_rs = "0.8"
zip = { version = "8.1.0", default-features = false, features = ["deflate"] }
# Потоковый gzip для снапшота БД. Уже в дереве зависимостей через zip/deflate —
# здесь объявлен явно, потому что используется напрямую.
flate2 = "1"
pdf-extract = "0.10.0"
regex = "1"
ammonia = "3"
maplit = "1"
cron = "0.12"
rquickjs = { version = "0.12", features = ["futures", "parallel"] }
rquickjs-serde = "0.6"
sqlparser = { version = "0.62", features = ["visitor"] }
# Mail integration (LLM send/receive via reg.ru): SMTP send + IMAP fetch/parse.
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-native-tls", "builder", "hostname"] }
imap = "2.4"
native-tls = "0.2"
mail-parser = "0.9"

[dev-dependencies]
# `ServiceExt::oneshot` — прогнать запрос через собранный Router прямо в тесте,
# без поднятия сервера. Версия совпадает с той, что уже тянет axum.
tower = { version = "0.5", features = ["util"] }

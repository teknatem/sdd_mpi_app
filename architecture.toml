# Машиночитаемый стандарт проекта.
#
# Зачем этот файл. Правила проекта до сих пор жили прозой в CLAUDE.md,
# naming-conventions.md и aggregate-structure-final.md, а каждый инструмент
# переписывал их у себя — и расходился. `.cursorrules` уже фиксирует, что
# предыдущая дублированная карта проекта была удалена именно поэтому. Здесь —
# один источник, который читают и люди, и инструменты.
#
# Файл ИСПОЛНЯЕТСЯ. `tools/check_architecture.ps1` читает раздел [[rules]] и
# сверяет с ним дерево исходников; `tools/gen_code_metrics.ps1` записывает
# число нарушений в `arch.naming_violations`, а храповик `check_health.ps1`
# не даёт ему расти. До появления валидатора этот файл был декларацией — ровно
# в том положении, в каком тихо умер naming-conventions.md (см. Цель 2).
#
# Как заводить новое правило: добавить блок [[rules]] ниже. Скрипт — движок
# для типов проверок, сами правила живут здесь. Если правило не должно
# применяться к конкретному месту — у него есть `waivers` с обязательным `why`.
# Отключать правило, чтобы пройти проверку, нельзя: waiver записывает причину,
# удаление правила её теряет.
#
# Чего здесь НЕТ намеренно:
#   * перечня конкретных объектов (a012, p904, dv001…) — он в ARCHITECTURE.md,
#     который генерируется из кода и потому всегда точен. Список, введённый
#     руками в двух местах, разъезжается — ровно та ошибка, от которой уходим;
#   * порогов метрик — они в crates/backend/src/system/metrics/catalog.rs,
#     потому что там же живёт их семантика (направление, единицы, подписи),
#     а tools/check_health.ps1 выводит из них список гейтов.
#
# Всё, что записано ниже как факт, ИЗМЕРЕНО по коду, а не предположено.
# Дата замера — в [meta].
#
# Это файл-ЭКЗЕМПЛЯР: правила именно этого приложения. Схема самого формата —
# какие разделы бывают, что означают поля [[rules]], чем `exempt` отличается от
# `waivers` — вынесена в канон экосистемы: F:\dev\sdd_ecosystem\MANIFEST_SCHEMA.md.
# Сам метод (срезы, origins, роли, индексы) — F:\dev\sdd_ecosystem\SDD.md.

[meta]
schema_version = 2
measured_at = "2026-08-17"
measured_commit = "c3e73f1"
# Редакция канона экосистемы, под которую выровнен этот манифест. Отставание от
# канона — не ошибка, а видимый долг миграции; проверяется `check_canon.ps1`
# в канон-репозитории.
canon_version = "2.0.0"
# Как перепроверить числа в [roles.*]: посчитать файлы по ролям в срезах
# соответствующего вида. Расхождение = либо код уехал, либо файл устарел.
# Обязательные роли (100 %) проверяет валидатор — они не могут разойтись молча;
# доли опциональных ролей — справочные, их сверяют глазами при правке файла.

# ---------------------------------------------------------------------------
# Слои и их статус
# ---------------------------------------------------------------------------
# slice  — зеркалируется по трём крейтам, элементы индексированы (a012, p904…)
# object — самостоятельная подсистема без индексов, живёт в одном-двух крейтах
# shared — сквозной слой: не сущность, границы нет, метрики среза неприменимы
#
# Практический смысл различия: для `slice` осмысленно спрашивать «полон ли
# набор ролей», для `object` и `shared` — нет.

[layers]
domain        = "slice"
projections   = "slice"
usecases      = "slice"
data_view     = "slice"
data_schemes  = "slice"
dashboards    = "slice"

general_ledger = "object"
quality        = "object"
plugins        = "object"
processes      = "object"   # механизм Процессов, ADR-0011
navigator      = "object"
bi_timeline    = "removed"   # см. [deviations.bi_timeline]

shared = "shared"
system = "shared"
api    = "shared"
layout = "shared"

# ---------------------------------------------------------------------------
# Диапазоны индексов
# ---------------------------------------------------------------------------

[indices]
aggregate    = { prefix = "a", pattern = "a\\d{3}_", range = [1, 499] }
usecase      = { prefix = "u", pattern = "u\\d{3}_", range = [501, 999] }
projection   = { prefix = "p", pattern = "p9\\d{2}_", range = [900, 999] }
dashboard    = { prefix = "d", pattern = "d4\\d{2}_", range = [400, 499] }
data_scheme  = { prefix = "ds", pattern = "ds\\d{2}_", range = [1, 99] }
data_view    = { prefix = "dv", pattern = "dv\\d{3}_", range = [1, 999] }
task         = { prefix = "task", pattern = "task\\d{3}_", range = [1, 999] }
# Процессы и Этапы (ADR-0011) хранятся в БД, а не файлами: пространства
# описаны здесь ради единого места, но обходом каталога не проверяются.
process      = { prefix = "pr", pattern = "pr\\d{4}", range = [1, 9999] }
stage        = { prefix = "st", pattern = "st\\d{4}", range = [1, 9999] }

# ---------------------------------------------------------------------------
# Роли по видам сущностей, в разрезе крейтов
# ---------------------------------------------------------------------------
# `required` — присутствует у 100 % срезов данного вида на дату замера.
# `optional` — присутствует у части; в скобках доля на дату замера.
# Роль вне обоих списков не является нарушением сама по себе: доменный сервис
# вроде a004_nomenclature/excel_import.rs — законный код, а не «файл не на
# месте». Инструмент не должен помечать такое как misplaced_path.

[roles.aggregate.backend]
required = ["mod.rs", "repository.rs", "service.rs"]           # 43/43
optional = ["representation.rs", "posting.rs", "change_token.rs", "llm.md"]
# representation.rs 14/43 — нужен только тем, кто участвует в drilldown.
# posting.rs 11/43 — только у документов, которые проводятся в Главную книгу.
# change_token.rs 4/43 — только там, где нужна инвалидация кэша фронта.
# llm.md 7/43 — заметки для LLM у тех срезов, где домен неочевиден.

[roles.aggregate.contracts]
required = ["mod.rs", "aggregate.rs", "metadata.json", "metadata_gen.rs"]  # 43/43
optional = []
# metadata_gen.rs генерируется из metadata.json через contracts/build.rs.
# Править руками нельзя: write_if_changed перезапишет на следующей сборке.

[roles.aggregate.frontend]
required = ["mod.rs"]              # 43/43
optional = ["ui"]                  # 41/43 — см. [deviations.a034_a035_no_ui_dir]

# Под-роли страницы агрегата. Именно здесь копился самый массовый разнобой:
# слой HTTP-доступа звался `model.rs` в domain и `api.rs` во всех остальных
# слоях фронта, а главный компонент — то `page.rs`, то `view.rs`. Приведено
# к единой триаде 2026-08-17; возврат старых имён ловит правило
# `fe_details_retired_names`.
[roles.aggregate.frontend.details]
required = ["mod.rs"]                                    # 38/38
optional = ["api.rs", "view_model.rs", "page.rs", "tabs"]
# api.rs 22/38 · view_model.rs 22/38 · page.rs 24/38 · tabs/ 14/38.
# Триада api+view_model+page — стандарт MVVM для страницы со вкладками;
# простым страницам хватает mod.rs + page.rs.

[roles.aggregate.frontend.list]
required = ["mod.rs"]              # 39/39
optional = ["state.rs", "widget.rs"]
# state.rs 28/39 — вынесенное состояние списка; у остальных оно внутри mod.rs.

[roles.projection.backend]
required = ["mod.rs", "repository.rs"]                          # 17/17
optional = ["service.rs", "builder.rs", "general_ledger_builder.rs", "representation.rs", "llm.md"]
# builder.rs — построение самой проекции; general_ledger_builder.rs — отдельная
# роль (проводки в ГК), не синоним. Раньше первая называлась двумя именами
# (builder.rs / projection_builder.rs); приведено к builder.rs.
# service.rs 12/17 · builder.rs 7/17 · остальные по 2/17.

[roles.projection.contracts]
required = ["mod.rs"]                                           # 17/17
optional = ["dto.rs", "metadata.json", "metadata_gen.rs"]
# dto.rs 16/17, metadata.* 17/17 у проекций (у general_ledger своя раскладка).

[roles.usecase.backend]
required = ["mod.rs", "executor.rs", "progress_tracker.rs"]     # 8/8
optional = ["processors", "docs", "llm.md"]
# processors/ 3/8. docs/ 2/8 — описания внешних API маркетплейсов рядом с
# клиентом, который их вызывает. Каталог назывался `api/`, что читалось как
# роль кода (ср. api.rs фронтового usecase); переименован 2026-08-17.
# Клиент внешнего API — <vendor>_api_client.rs, 6/8 (у u505 и u508 его нет:
# они не ходят наружу).

[roles.usecase.frontend]
required = ["mod.rs", "view.rs", "api.rs"]                      # 8/8
optional = []
# Было api.rs (5) / ops.rs (3) для одной и той же роли. Приведено к api.rs.

[roles.dashboard.frontend]
required = ["mod.rs"]              # 8/8
optional = ["api.rs", "ui", "ui.rs"]
# api.rs 7/8. ui/ против ui.rs — раскладка, а не имя роли, см.
# [conventions.module_layout]. Бэкенд-часть есть только у d400 —
# см. [deviations.frontend_only_dashboards].

[roles.data_view.backend]
required = ["mod.rs", "metadata.json"]    # 8/8
optional = ["llm.md"]                     # 2/8
# metadata.json несёт `id` — он обязан совпадать с именем каталога, это
# проверяет правило `dv_dir_matches_metadata`.

[roles.data_scheme.backend]
required = ["mod.rs"]              # 3/3
optional = []
# metadata.json у ds-схем нет: их описание живёт в самом mod.rs.

# ---------------------------------------------------------------------------
# Разделяемое ядро: имена, которые НЕ являются сущностями
# ---------------------------------------------------------------------------
# Каталог внутри слоя-среза, но без индекса. Инструмент, считающий их
# агрегатами, получает мусорные метрики и ложные findings.
#
# Имя одно — `common`. Раньше их было два (`common` в contracts, `shared` во
# фронте), и файл легализовал оба, то есть фиксировал разнобой вместо того,
# чтобы его снять. Приведено к `common` 2026-08-17.

[shared_kernel]
names = ["common"]
paths = [
  "crates/*/src/domain/common",
  "crates/*/src/usecases/common",
]

# ---------------------------------------------------------------------------
# Хабы: файлы с искусственно высоким fan-in
# ---------------------------------------------------------------------------
# Их обязан трогать КАЖДЫЙ срез, поэтому любая метрика связности видит их как
# центр проекта и искажает Ce/Ca для всех остальных. Пока они существуют,
# анализатору нужен этот список.
#
# Это не индульгенция: разбор — Фаза 4 плана модернизации. Список существует,
# чтобы метрики до тех пор оставались честными.

[hubs]
files = [
  "crates/backend/src/api/routes.rs",             # 523 маршрута, 81 функция *_routes()
  "crates/frontend/src/layout/tabs/registry.rs",  # ~90 импортов из 43 срезов
  "crates/backend/src/system/access/route_registry.rs",
]

# ---------------------------------------------------------------------------
# Структурные пороги
# ---------------------------------------------------------------------------
# Только про форму кода. Пороги метрик — в catalog.rs (см. шапку файла).

[thresholds]
file_lines_warn = 1000
file_lines_hub  = 2000   # выше этого файл перестаёт быть большим и становится хабом

# ---------------------------------------------------------------------------
# Конвенции, которые инструменты трактовали как нарушения
# ---------------------------------------------------------------------------

[conventions.module_layout]
# И `foo.rs`, и `foo/mod.rs` — нормальные формы, а не разнобой.
# Замерено: 105 каталогов содержат только mod.rs, 1166 модулей — простые файлы.
# Правило: модуль остаётся файлом, пока у него нет подмодулей; каталог с mod.rs
# появляется, когда они заводятся (или заведомо появятся: ui/list/, ui/details/
# держат каталог ради позиционной роли имени).
# Приводить одну форму к другой смысла нет — это выбор раскладки, а не имя роли.
#
# Единственное исключение — как раз позиционные `ui/list` и `ui/details`: имя
# там несёт роль, а не только адрес, поэтому форма каталога обязательна и её
# проверяет правило `fe_positional_ui_dirs`. Этим же правилом закрыт a043,
# у которого были плоские ui/details.rs и ui/list.rs.
both_forms_valid = true

[conventions.api_paths]
# Единой формы URL в проекте НЕТ, и это осознанно оставлено как есть.
# Замерено: /api/<имя> — 150 путей, /api/aNNN/<имя> — 149, /api/aNNN-<имя> — 69,
# /api/<код>/… (p9XX, u5XX, dsXX, d4XX) — 80.
# Почему не приводим: URL — публичный контракт. Его читают фронт, внешний API
# (/api/ext/v1/*), 1С и Power BI. Переименование ради единообразия ломает
# работающих потребителей и не даёт ничего, кроме красоты.
# Новый эндпоинт заводится в форме /api/aNNN/<имя> — она самая частая среди
# недавних и однозначно связывает путь со срезом.
unified = false
preferred_for_new = "/api/aNNN/<name>"

[conventions.doc_corpora]
# kebab-case у части `.md` — НЕ разнобой, и приводить его к snake_case нельзя.
# В этих каталогах имя файла является идентификатором ДАННЫХ, а не модуля:
#   * crates/backend/skills/*.md — seed-каталог навыков. `skills.rs` пишет
#     `relative_path` во внешний каталог [llm] skills_path при старте;
#     переименование файла создаст дубль в боевых данных.
#   * crates/backend/src/usecases/*/docs/*.md — статьи базы знаний.
#     `knowledge_base.rs` использует основу имени как `id` статьи
#     (id: "wb-api-overview"), и он же попадает в каталог `app/` боевых данных.
# Правило `rust_snake_case` поэтому смотрит только на `.rs`.
#
# Snake_case остаётся нормой для `.md`, которые к данным не относятся:
# `llm.md` рядом с кодом, prompts/, shared/llm/docs/.
kebab_case_paths = [
  "crates/backend/skills/**",
  "crates/backend/src/usecases/*/docs/**",
]

[conventions.script_homes]
# Два каталога скриптов в корне — не разнобой и не «исторически сложилось».
# У них разные жильцы, и граница проходит по тому, КТО и КОГДА скрипт запускает:
#
#   tools/    исполняется процессом разработки. Генераторы карт и метрик, гейты
#             (check_architecture, check_health), git-хук, цикл сборки и dev-петля
#             (build_frontend, dev_client, run_backend), замер стоимости
#             сборки, доступ агента к API работающего dev-экземпляра
#             (dev_token, ask_internal_chat), проверка кодировки текста.
#             Признак: вызывается из хука, CI, CLAUDE.md или агентом во время
#             правки кода; ничего не знает о боевых данных и о сервере.
#
#   scripts/  операции над средой и данными. Релиз и деплой (build-release*,
#             update-release, install-servy), упаковка распространяемых
#             артефактов (плагины), наполнение базы тестовыми данными (*.sql).
#             Признак: трогает боевую БД, службу Servy, целевую машину или
#             артефакт, который уезжает наружу.
#
#             Снимка и восстановления БД здесь НЕТ намеренно. База работает в
#             режиме WAL, и копия `app.db`, снятая под нагрузкой без `-wal`, —
#             мусор; правильный снимок делает `VACUUM INTO` в самом приложении
#             (system/datasets, UI «Наборы данных»). Три скрипта, копировавшие
#             файл, удалены 2026-08-19: за всё время ими не воспользовались ни
#             разу, а выглядели они как рабочий бэкап.
#
# Почему это выписано и проверяется: разница между «инструмент разработки» и
# «операция над средой» не видна из имени файла, и до 2026-08-19 каталоги
# перемешались молча — гейт кодировки и сборщик дампа кода лежали в scripts/,
# упаковщик плагина для распространения — в tools/, а два мёртвых с 2025 года
# python-скрипта числились живыми инструментами. Состав обоих каталогов
# перечислен правилами `tools_dir_manifest` и `scripts_dir_manifest`: новый
# скрипт нельзя положить, не классифицировав его явно.
#
# Каталог tools/hooks/ — не жилец ни там, ни там: это git-хуки, их адрес задан
# `git config core.hooksPath`. Правила смотрят только на файлы верхнего уровня.
dev_process = "tools/"
environment_and_data = "scripts/"

# ---------------------------------------------------------------------------
# Осознанные отклонения
# ---------------------------------------------------------------------------
# Смысл раздела: отличить «ещё не сделали» от «так задумано». Без него
# инструмент (и человек) обязан считать любую дыру дефектом.

[deviations.frontend_only_dashboards]
what = ["d401_wb_finance", "d405_metadata_dashboard"]
why = "Дашборд — потребитель слоя данных. Бэкенд-часть нужна не всем; d400 её имеет, остальные считают на фронте."
intentional = true

[deviations.projections_without_frontend]
what = ["p912_nomenclature_costs", "p915_mp_order_events", "p916_mp_sales_funnel_turnovers"]
why = "Служебные проекции: читаются другими срезами и отчётами, собственной страницы не имеют. У p916 нет и handler'а."
intentional = true

[deviations.ds03_without_handler]
what = ["ds03_p904_sales"]
why = "Схема используется движком universal_dashboard напрямую; отдельный handler, как у ds01/ds02, ей не нужен."
intentional = true

[deviations.bi_timeline]
what = ["bi_timeline"]
why = """
Слой существовал пустым каталогом во всех трёх крейтах и попадал в каждый
листинг. Каталоги удалены 2026-08-17. Живой код BI timeline — в
crates/frontend/src/shared/bi_timeline (фронт) и роутах /api/bi-timeline/*.
Пустые каталоги git не отслеживает, поэтому в свежем клоне их и не было —
удаление было гигиеной рабочей копии, а не изменением репозитория.
"""
intentional = true

[deviations.a034_a035_no_ui_dir]
what = ["a034_ym_realization", "a035_ym_settlement_recon"]
why = "UI целиком в mod.rs (1588 и 893 строки) вместо каталога ui/. НЕ задумано — незавершённые срезы, достройка в Фазе 4 плана модернизации."
intentional = false

[deviations.a041_stub]
what = ["a041_ym_shows_sales_daily"]
why = "Заглушка: mod.rs + ui/mod.rs без списка и деталей. НЕ задумано — данные собираются task026, страница ещё не сделана."
intentional = false

[deviations.orphan_files]
what = []
why = """
Файлы, не подключённые ни одним `mod`: компилятор их не собирает, cargo fmt не
форматирует, но в строках кода они посчитаны. Было семь штук на 631 строку;
удалены 2026-08-18 по решению владельца — включая executor_nomenclature.rs и
IMPORT_NOMENCLATURE_NEW.txt, две половины незавершённой переделки импорта
номенклатуры. Содержимое доступно в истории git, поэтому «намерение» ничего не
теряет, а мёртвый код перестаёт числиться живым.

Запись оставлена пустой намеренно: она объясняет, что означает метрика
code.orphan_files, и куда писать следующего сироту, если он появится. Метрика
держит их число от роста.
"""
intentional = false

# ===========================================================================
# Правила валидатора
# ===========================================================================
# Читает tools/check_architecture.ps1. Скрипт реализует ТИПЫ проверок, здесь
# живут сами правила — поэтому новое правило добавляется правкой этого файла,
# без изменения кода валидатора.
#
# Поля:
#   id          короткое имя, попадает в отчёт и в диагностику
#   type        тип проверки (см. список типов в шапке check_architecture.ps1)
#   severity    "error" — считается гейтом; "warn" — только печатается
#   scope       glob каталогов, к которым правило применяется
#   exempt      globs, которые правило пропускает молча (структурные исключения)
#   waivers     [{ path, why }] — точечные разрешения; `why` обязателен
#
# Разница exempt и waivers: exempt — «правило сюда не относится по смыслу»
# (общее ядро не является срезом), waiver — «относится, но мы осознанно
# разрешили вот здесь и вот почему». Второе видно в отчёте по -ShowWaived.

# --- Обязательные роли ------------------------------------------------------

[[rules]]
id = "be_aggregate_roles"
type = "required_files"
severity = "error"
scope = "crates/backend/src/domain/a*"
files = ["mod.rs", "repository.rs", "service.rs"]

[[rules]]
id = "co_aggregate_roles"
type = "required_files"
severity = "error"
scope = "crates/contracts/src/domain/a*"
files = ["mod.rs", "aggregate.rs", "metadata.json", "metadata_gen.rs"]

[[rules]]
id = "fe_aggregate_roles"
type = "required_files"
severity = "error"
scope = "crates/frontend/src/domain/a*"
files = ["mod.rs"]

[[rules]]
id = "be_projection_roles"
type = "required_files"
severity = "error"
scope = "crates/backend/src/projections/p*"
files = ["mod.rs", "repository.rs"]

[[rules]]
id = "be_usecase_roles"
type = "required_files"
severity = "error"
scope = "crates/backend/src/usecases/u*"
files = ["mod.rs", "executor.rs", "progress_tracker.rs"]

[[rules]]
id = "fe_usecase_roles"
type = "required_files"
severity = "error"
scope = "crates/frontend/src/usecases/u*"
files = ["mod.rs", "view.rs", "api.rs"]

[[rules]]
# Инвентаризация знаний — механизм, а не набор файлов: реестр поверхностей,
# разметка инструментов, сбор, хранение и сборка ответа. Роль без файла
# означает, что её обязанность расползлась по соседям.
id = "be_knowledge_roles"
type = "required_files"
severity = "error"
scope = "crates/backend/src/knowledge"
files = ["mod.rs", "catalog.rs", "tool_map.rs", "collector.rs", "repository.rs", "service.rs"]

[[rules]]
id = "be_data_view_roles"
type = "required_files"
severity = "error"
scope = "crates/backend/src/data_view/dv*"
files = ["mod.rs", "metadata.json"]

# --- Одна роль — одно имя ---------------------------------------------------
# Ровно то, ради чего файл получил зубы: переименования 2026-08-17 держатся
# правилами, а не памятью. Без этих трёх блоков старое имя вернётся первым же
# copy-paste со старого среза, и никто этого не заметит.

[[rules]]
id = "fe_details_retired_names"
type = "forbidden_filename"
severity = "error"
scope = "crates/frontend/src/domain/*/ui/details"
files = ["model.rs", "view.rs"]
use_instead = "api.rs (HTTP-доступ) и page.rs (компонент страницы)"

[[rules]]
id = "fe_usecase_retired_names"
type = "forbidden_filename"
severity = "error"
scope = "crates/frontend/src/usecases/u*"
files = ["ops.rs"]
use_instead = "api.rs"

[[rules]]
id = "be_projection_retired_names"
type = "forbidden_filename"
severity = "error"
scope = "crates/backend/src/projections/p*"
files = ["projection_builder.rs"]
use_instead = "builder.rs"

[[rules]]
id = "fe_positional_ui_dirs"
type = "forbidden_filename"
severity = "error"
scope = "crates/frontend/src/domain/*/ui"
files = ["list.rs", "details.rs"]
use_instead = "каталог list/ или details/ с mod.rs — имя там несёт роль, см. [conventions.module_layout]"

# --- Индексы в именах каталогов ---------------------------------------------

[[rules]]
id = "domain_dir_names"
type = "dir_name_pattern"
severity = "error"
scope = "crates/*/src/domain"
pattern = "^a\\d{3}_[a-z0-9_]+$"
exempt = ["crates/*/src/domain/common"]

[[rules]]
id = "projection_dir_names"
type = "dir_name_pattern"
severity = "error"
scope = "crates/*/src/projections"
pattern = "^p9\\d{2}_[a-z0-9_]+$"
exempt = ["crates/*/src/projections/general_ledger"]

[[rules]]
id = "usecase_dir_names"
type = "dir_name_pattern"
severity = "error"
scope = "crates/*/src/usecases"
pattern = "^u5\\d{2}_[a-z0-9_]+$"
exempt = ["crates/*/src/usecases/common"]

[[rules]]
id = "dashboard_dir_names"
type = "dir_name_pattern"
severity = "error"
scope = "crates/*/src/dashboards"
pattern = "^d4\\d{2}_[a-z0-9_]+$"

[[rules]]
id = "data_view_dir_names"
type = "dir_name_pattern"
severity = "error"
scope = "crates/backend/src/data_view"
pattern = "^dv\\d{3}_[a-z0-9_]+$"
# Каталоги звались просто dv001…dv008 — единственное семейство индексов без
# имени, и притом metadata.json внутри уже нёс полное имя. Переименованы
# 2026-08-17; правило не даёт завести следующий dv без имени.

[[rules]]
id = "data_scheme_dir_names"
type = "dir_name_pattern"
severity = "error"
scope = "crates/backend/src/data_schemes"
pattern = "^ds\\d{2}_[a-z0-9_]+$"

[[rules]]
id = "task_file_names"
type = "dir_name_pattern"
severity = "warn"
scope = "crates/backend/src/system/tasks/managers"
pattern = "^task\\d{3}_[a-z0-9_]+$"
# severity=warn, потому что каталогов там нет вовсе — правило держит место
# под будущую проверку имён файлов task0NN и сейчас ничего не находит.

# --- Имя каталога против собственных метаданных ------------------------------

[[rules]]
id = "dv_dir_matches_metadata"
type = "dir_matches_metadata_id"
severity = "error"
scope = "crates/backend/src/data_view/dv*"
# Только data_view: у агрегатов и проекций metadata.json описывает поля
# сущности и поля `id` в нём нет — проверять там нечего.

# --- Регистр имён -----------------------------------------------------------

[[rules]]
id = "rust_snake_case"
type = "snake_case_files"
severity = "error"
scope = "crates/*/src"
# Только .rs. Про `.md` см. [conventions.doc_corpora]: там имя файла —
# идентификатор данных, и kebab-case является нормой, а не долгом.

# --- Пути, которые компилятор не проверяет -----------------------------------

[[rules]]
id = "kb_source_path_sync"
type = "embedded_doc_path_sync"
severity = "error"
file = "crates/backend/src/shared/llm/knowledge_base.rs"
include_prefix = "crates/backend/src/shared/llm"
# EmbeddedKnowledgeSource пишет путь документа ДВАЖДЫ: include_str!(..), который
# проверяет rustc, и source_path: "..", который является просто строкой.
# Переименуй каталог — вторая молча протухнет: статья продолжит работать, но
# будет указывать на несуществующий исходник. Единственная проверка здесь,
# которая ловит то, что компилятор поймать не может.

# --- Скрипты: два дома, разные жильцы ----------------------------------------
# Состав каталогов перечислен явно, потому что классифицировать скрипт может
# только человек: по имени файла не видно, гейт это разработки или операция над
# боевой средой. Смысл границы — [conventions.script_homes].
# Правила смотрят на файлы ВЕРХНЕГО уровня: tools/hooks/ — git-хуки, у них свой
# адрес (core.hooksPath), к манифесту они не относятся.

[[rules]]
id = "tools_dir_manifest"
type = "dir_manifest"
severity = "error"
scope = "tools"
extensions = [".ps1", ".py", ".sql"]
hint = "инструменты разработки — в tools/, операции над средой и данными — в scripts/ (см. [conventions.script_homes])"
files = [
  "ask_internal_chat.ps1",
  "build_frontend.ps1",
  "check_architecture.ps1",
  "check_health.ps1",
  "check_text_encoding.py",
  "dev_client.ps1",
  "dev_token.ps1",
  "gen_architecture.ps1",
  "gen_code_metrics.ps1",
  "gen_ui_registry.ps1",
  "measure_build.ps1",
  "run_backend.ps1",
]

[[rules]]
id = "scripts_dir_manifest"
type = "dir_manifest"
severity = "error"
scope = "scripts"
extensions = [".ps1", ".py", ".sql"]
hint = "операции над средой и данными — в scripts/, инструменты разработки — в tools/ (см. [conventions.script_homes])"
files = [
  "build-release-max.ps1",
  "build-release.ps1",
  "install-servy.ps1",
  "package_ym_cash_payments_plugin.ps1",
  "test_data_a024_bi_indicator.sql",
  "update-release.ps1",
]

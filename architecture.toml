# Машиночитаемый стандарт проекта.
#
# Зачем этот файл. Правила проекта до сих пор жили прозой в CLAUDE.md,
# naming-conventions.md и aggregate-structure-final.md, а каждый инструмент
# переписывал их у себя — и расходился. `.cursorrules` уже фиксирует, что
# предыдущая дублированная карта проекта была удалена именно поэтому. Здесь —
# один источник, который читают и люди, и инструменты.
#
# Чего здесь НЕТ намеренно:
#   * перечня конкретных объектов (a012, p904, dv001…) — он в ARCHITECTURE.md,
#     который генерируется из кода и потому всегда точен. Список, введённый
#     руками в двух местах, разъезжается — ровно та ошибка, от которой уходим;
#   * порогов метрик — они в crates/backend/src/system/metrics/catalog.rs,
#     потому что там же живёт их семантика (направление, единицы, подписи),
#     а tools/check_health.ps1 выводит из них список гейтов.
#
# Всё, что записано ниже как факт, ИЗМЕРЕНО по коду, а не предположено.
# Дата замера — в [meta].

[meta]
schema_version = 1
measured_at = "2026-08-17"
measured_commit = "3751843"
# Как перепроверить числа в [roles.*]: посчитать файлы по ролям в срезах
# соответствующего вида. Расхождение = либо код уехал, либо файл устарел.

# ---------------------------------------------------------------------------
# Слои и их статус
# ---------------------------------------------------------------------------
# slice  — зеркалируется по трём крейтам, элементы индексированы (a012, p904…)
# object — самостоятельная подсистема без индексов, живёт в одном-двух крейтах
# shared — сквозной слой: не сущность, границы нет, метрики среза неприменимы
#
# Практический смысл различия: для `slice` осмысленно спрашивать «полон ли
# набор ролей», для `object` и `shared` — нет.

[layers]
domain        = "slice"
projections   = "slice"
usecases      = "slice"
data_view     = "slice"
data_schemes  = "slice"
dashboards    = "slice"

general_ledger = "object"
quality        = "object"
plugins        = "object"
navigator      = "object"
bi_timeline    = "removed"   # см. [deviations.bi_timeline]

shared = "shared"
system = "shared"
api    = "shared"
layout = "shared"

# ---------------------------------------------------------------------------
# Диапазоны индексов
# ---------------------------------------------------------------------------

[indices]
aggregate    = { prefix = "a", pattern = "a\\d{3}_", range = [1, 499] }
usecase      = { prefix = "u", pattern = "u\\d{3}_", range = [501, 999] }
projection   = { prefix = "p", pattern = "p9\\d{2}_", range = [900, 999] }
dashboard    = { prefix = "d", pattern = "d4\\d{2}_", range = [400, 499] }
data_scheme  = { prefix = "ds", pattern = "ds\\d{2}_", range = [1, 99] }
data_view    = { prefix = "dv", pattern = "dv\\d{3}", range = [1, 999] }
task         = { prefix = "task", pattern = "task\\d{3}_", range = [1, 999] }

# ---------------------------------------------------------------------------
# Роли по видам сущностей, в разрезе крейтов
# ---------------------------------------------------------------------------
# `required` — присутствует у 100 % срезов данного вида на дату замера.
# `optional` — присутствует у части; в скобках доля на дату замера.
# Роль вне обоих списков не является нарушением сама по себе: доменный сервис
# вроде a004_nomenclature/excel_import.rs — законный код, а не «файл не на
# месте». Инструмент не должен помечать такое как misplaced_path.

[roles.aggregate.backend]
required = ["mod.rs", "repository.rs", "service.rs"]           # 43/43
optional = ["representation.rs", "posting.rs", "change_token.rs", "llm.md"]
# representation.rs 14/43 — нужен только тем, кто участвует в drilldown.
# posting.rs 11/43 — только у документов, которые проводятся в Главную книгу.
# change_token.rs 4/43 — только там, где нужна инвалидация кэша фронта.

[roles.aggregate.contracts]
required = ["mod.rs", "aggregate.rs", "metadata.json", "metadata_gen.rs"]  # 43/43
optional = []
# metadata_gen.rs генерируется из metadata.json через contracts/build.rs.
# Править руками нельзя: write_if_changed перезапишет на следующей сборке.

[roles.aggregate.frontend]
required = ["mod.rs"]              # 43/43
optional = ["ui"]                  # 41/43 — см. [deviations.a034_a035]

[roles.projection.backend]
required = ["mod.rs", "repository.rs"]                          # 17/17
optional = ["service.rs", "builder.rs", "general_ledger_builder.rs", "representation.rs", "llm.md"]
# builder.rs — построение самой проекции; general_ledger_builder.rs — отдельная
# роль (проводки в ГК), не синоним. Раньше первая называлась двумя именами
# (builder.rs / projection_builder.rs); приведено к builder.rs.

[roles.usecase.backend]
required = ["mod.rs", "executor.rs", "progress_tracker.rs"]     # 8/8
optional = ["processors", "api"]

[roles.usecase.frontend]
required = ["mod.rs", "view.rs", "api.rs"]                      # 8/8
optional = []
# Было api.rs (5) / ops.rs (3) для одной и той же роли. Приведено к api.rs.

# ---------------------------------------------------------------------------
# Разделяемое ядро: имена, которые НЕ являются сущностями
# ---------------------------------------------------------------------------
# Каталог внутри слоя-среза, но без индекса. Инструмент, считающий их
# агрегатами, получает мусорные метрики и ложные findings.

[shared_kernel]
names = ["common", "shared"]
paths = [
  "crates/*/src/domain/common",
  "crates/*/src/usecases/common",
  "crates/*/src/usecases/shared",
]

# ---------------------------------------------------------------------------
# Хабы: файлы с искусственно высоким fan-in
# ---------------------------------------------------------------------------
# Их обязан трогать КАЖДЫЙ срез, поэтому любая метрика связности видит их как
# центр проекта и искажает Ce/Ca для всех остальных. Пока они существуют,
# анализатору нужен этот список.
#
# Это не индульгенция: разбор — Фаза 4 плана модернизации. Список существует,
# чтобы метрики до тех пор оставались честными.

[hubs]
files = [
  "crates/backend/src/api/routes.rs",             # 523 маршрута, 81 функция *_routes()
  "crates/frontend/src/layout/tabs/registry.rs",  # ~90 импортов из 43 срезов
  "crates/backend/src/system/access/route_registry.rs",
]

# ---------------------------------------------------------------------------
# Структурные пороги
# ---------------------------------------------------------------------------
# Только про форму кода. Пороги метрик — в catalog.rs (см. шапку файла).

[thresholds]
file_lines_warn = 1000
file_lines_hub  = 2000   # выше этого файл перестаёт быть большим и становится хабом

# ---------------------------------------------------------------------------
# Конвенции, которые инструменты трактовали как нарушения
# ---------------------------------------------------------------------------

[conventions.module_layout]
# И `foo.rs`, и `foo/mod.rs` — нормальные формы, а не разнобой.
# Замерено: 105 каталогов содержат только mod.rs, 1166 модулей — простые файлы.
# Правило: модуль остаётся файлом, пока у него нет подмодулей; каталог с mod.rs
# появляется, когда они заводятся (или заведомо появятся: ui/list/, ui/details/
# держат каталог ради позиционной роли имени).
# Приводить одну форму к другой смысла нет — это выбор раскладки, а не имя роли.
both_forms_valid = true

[conventions.api_paths]
# Единой формы URL в проекте НЕТ, и это осознанно оставлено как есть.
# Замерено: /api/<имя> — 150 путей, /api/aNNN/<имя> — 149, /api/aNNN-<имя> — 69,
# /api/<код>/… (p9XX, u5XX, dsXX, d4XX) — 80.
# Почему не приводим: URL — публичный контракт. Его читают фронт, внешний API
# (/api/ext/v1/*), 1С и Power BI. Переименование ради единообразия ломает
# работающих потребителей и не даёт ничего, кроме красоты.
# Новый эндпоинт заводится в форме /api/aNNN/<имя> — она самая частая среди
# недавних и однозначно связывает путь со срезом.
unified = false
preferred_for_new = "/api/aNNN/<name>"

# ---------------------------------------------------------------------------
# Осознанные отклонения
# ---------------------------------------------------------------------------
# Смысл раздела: отличить «ещё не сделали» от «так задумано». Без него
# инструмент (и человек) обязан считать любую дыру дефектом.

[deviations.frontend_only_dashboards]
what = ["d401_wb_finance", "d405_metadata_dashboard"]
why = "Дашборд — потребитель слоя данных. Бэкенд-часть нужна не всем; d400 её имеет, остальные считают на фронте."
intentional = true

[deviations.projections_without_frontend]
what = ["p912_nomenclature_costs", "p915_mp_order_events", "p916_mp_sales_funnel_turnovers"]
why = "Служебные проекции: читаются другими срезами и отчётами, собственной страницы не имеют. У p916 нет и handler'а."
intentional = true

[deviations.ds03_without_handler]
what = ["ds03_p904_sales"]
why = "Схема используется движком universal_dashboard напрямую; отдельный handler, как у ds01/ds02, ей не нужен."
intentional = true

[deviations.bi_timeline]
what = ["bi_timeline"]
why = """
Слой существовал пустым каталогом во всех трёх крейтах и попадал в каждый
листинг. Каталоги удалены 2026-08-17. Живой код BI timeline — в
crates/frontend/src/shared/bi_timeline (фронт) и роутах /api/bi-timeline/*.
Пустые каталоги git не отслеживает, поэтому в свежем клоне их и не было —
удаление было гигиеной рабочей копии, а не изменением репозитория.
"""
intentional = true

[deviations.a034_a035_no_ui_dir]
what = ["a034_ym_realization", "a035_ym_settlement_recon"]
why = "UI целиком в mod.rs (1588 и 893 строки) вместо каталога ui/. НЕ задумано — незавершённые срезы, достройка в Фазе 4 плана модернизации."
intentional = false

[deviations.a041_stub]
what = ["a041_ym_shows_sales_daily"]
why = "Заглушка: mod.rs + ui/mod.rs без списка и деталей. НЕ задумано — данные собираются task026, страница ещё не сделана."
intentional = false

[deviations.orphan_files]
what = [
  "crates/backend/src/usecases/u501_import_from_ut/executor_nomenclature.rs",
  "crates/backend/src/usecases/u501_import_from_ut/IMPORT_NOMENCLATURE_NEW.txt",
  "crates/backend/src/shared/universal_dashboard/schema_registry.rs",
  "crates/frontend/src/shared/data/db.rs",
  "crates/frontend/src/layout/top_header/windows_dropdown.rs",
  "crates/frontend/src/domain/a024_bi_indicator/ui/details/tabs/drill_spec.rs",
  "crates/frontend/src/domain/a024_bi_indicator/ui/details/tabs/params.rs",
]
why = """
Файлы, которые не подключает ни один `mod`: компилятор их не собирает,
cargo fmt не форматирует, но в строках кода они посчитаны (631 строка).
Не удалены намеренно: executor_nomenclature.rs и IMPORT_NOMENCLATURE_NEW.txt —
две половины незавершённой переделки импорта номенклатуры («Заменить метод
import_nomenclature в executor.rs, скопировать вручную»), то есть чьё-то
намерение, а не мусор. Судьба остальных требует решения владельца.
Метрика code.orphan_files держит их число от роста.
"""
intentional = false

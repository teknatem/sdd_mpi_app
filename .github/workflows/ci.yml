# The project's first executing gate.
#
# Until now the only automation was tools/hooks/pre-commit, which states outright
# that it "never blocks a commit". codebase_metrics.json tracked 40+ numbers with
# nobody to compare them to yesterday's. This workflow is the missing half of
# goal 9 of the architecture evolution program: not more measurement, a place
# where measurement has consequences.
#
# Runs on ubuntu even though development is on Windows: every check here is
# platform-neutral, and the Linux runners are markedly faster. The parts that are
# genuinely Windows-shaped (the live database under F:/data, run_backend.ps1)
# are not exercised by CI at all — the tests that touch live data skip themselves
# when the directory is absent.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI never reuses an incremental cache across runs, so producing one is pure
  # cost — both in time and in artifact size handed to the cache action.
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: check / test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          # frontend only ever builds for wasm — see CLAUDE.md.
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Plain `cargo fmt --all --check` — CI runs exactly what a developer runs.
      #
      # It used to need a `grep -v '_gen\.rs'` filter over cargo's output: the 62
      # files contracts/build.rs emits into src/ (not OUT_DIR) carried the
      # generator's own formatting, write_if_changed compared against precisely
      # that, and so every `cargo fmt --all` was undone by the next build. The
      # generator now emits `#![cfg_attr(rustfmt, rustfmt::skip)]`, rustfmt leaves
      # those files alone, and the gate no longer has to disagree with the tool.
      #
      # Note `cargo fmt`, not `git ls-files | xargs rustfmt`: the latter reaches
      # .rs files under crates/*/src that no `mod` declares, i.e. files cargo
      # never compiles — a gate that formats dead code is a gate nobody trusts.
      - name: Format
        run: cargo fmt --all -- --check

      # Split per crate rather than --workspace: frontend cannot be checked for
      # the host target, and a single failing crate should name itself.
      - name: Check contracts
        run: cargo check -p contracts

      - name: Check backend
        run: cargo check -p backend

      - name: Check frontend (wasm)
        # --profile wasm-dev — тот же профиль, что у Trunk.toml и у разработчика
        # локально. Без него CI проверяет профиль, которым фронт никто не собирает.
        run: cargo check -p frontend --target wasm32-unknown-unknown --profile wasm-dev

      - name: Test backend
        # Includes router_builds, which is the only place an axum path conflict
        # surfaces without starting the server.
        run: cargo test -p backend

      # Report-only, deliberately. A codebase that has never run clippy will
      # produce a large first wave of warnings, and turning that into a gate on
      # day one would only teach us to ignore the gate. The deny-level lints that
      # ARE enforced live in [workspace.lints] in Cargo.toml, chosen because the
      # codebase is already clean of them. Tighten this once the backlog is triaged.
      - name: Clippy (advisory)
        continue-on-error: true
        run: cargo clippy -p contracts -p backend --all-targets

  health:
    name: metrics ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only on PRs: the ratchet compares against a base branch, and on a direct
    # push to main there is no meaningful "before" to compare with.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # check_health.ps1 reads the baseline with `git show <ref>:file`, which
          # needs the base branch present, not just this commit.
          fetch-depth: 0

      # Recomputed rather than trusted: codebase_metrics.json is produced by a
      # local pre-commit hook, and a hook that was never enabled
      # (`git config core.hooksPath tools/hooks`) leaves it stale. Measuring here
      # means the comparison describes the code in the PR, not the code the
      # author happened to have hooked.
      - name: Recompute metrics
        run: pwsh -File tools/gen_code_metrics.ps1

      - name: Ratchet against base branch
        run: pwsh -File tools/check_health.ps1 -Baseline origin/${{ github.base_ref }}

[workspace]
resolver = "2"
members = [
    "crates/frontend",
    "crates/backend",
    "crates/contracts",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

# Only lints the codebase is ALREADY clean of (verified: zero occurrences of all
# three across crates/*/src). Denying them costs nothing today and keeps them
# from ever creeping in — which is the only kind of gate worth adding to a
# 419k-line project up front.
#
# Deliberately NOT here: clippy::unwrap_used. There are 572 existing calls, so
# even at "warn" it would bury every other diagnostic under noise. That number is
# tracked as the `smells.unwrap` metric and held down by tools/check_health.ps1
# instead — a ratchet suits a large backlog, a lint does not.
[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
once_cell = "1"
uuid = { version = "=1.19.0", features = ["v4", "v5", "serde", "js"] }

[profile.dev]
opt-level = 0
debug = 0
incremental = true

# Код проекта оставляем без оптимизаций для быстрых dev-пересборок.
# Для frontend dev-сборки не пишем debuginfo в wasm-артефакт.
[profile.dev.package.frontend]
opt-level = 0
debug = 0
[profile.dev.package.contracts]
opt-level = 0
[profile.dev.package.backend]
opt-level = 0

# adobe-cmap-parser 0.4.1 имеет integer overflow в парсере CMap (lib.rs:208),
# который паникует только при включённых overflow-checks (по умолчанию в dev).
# В release этот `+` просто оборачивается. Отключаем проверки для этого пакета,
# чтобы извлечение PDF (pdf-extract) работало и в dev-сборке.
[profile.dev.package.adobe-cmap-parser]
overflow-checks = false

# Frontend dev: небольшая оптимизация заметно уменьшает WASM и время wasm-bindgen.
# Запуск: trunk serve --cargo-profile wasm-dev
[profile.wasm-dev]
inherits = "dev"
opt-level = 1
debug = 0
incremental = true

[profile.wasm-dev.package.frontend]
opt-level = 1
debug = 0

[profile.release]
# Обычный production: параллельная кодогенерация и Thin LTO ускоряют сборку.
codegen-units = 16
lto = "thin"
# opt-level = 3 (скорость). Поменять на "s" если нужно сократить размер ценой скорости.
opt-level = 3

# Максимальная оптимизация ценой существенно более долгой сборки.
[profile.release-max]
inherits = "release"
opt-level = 3
codegen-units = 1
lto = "fat"
incremental = false
panic = "abort"
strip = "symbols"
